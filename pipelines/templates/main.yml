# ============================================================
# 平台统一 CI 模板 — 业务项目 .gitlab-ci.yml include 此文件
# 版本锁定见平台仓库 versions.lock (gitleaks v8.30.1 / trivy v0.74.0 / mkdocs-material 9.7.7)
#
# 项目级开关(在项目 .gitlab-ci.yml 的 variables 里覆盖):
#   LINT_CMD / TEST_CMD / BUILD_CMD   自定义命令(未设置则对应 job 跳过)
#   ENABLE_UNIT_TEST: "true"          启用单测 job
#   ENABLE_TRIVY: "true"              启用镜像/文件漏洞扫描
#   DEPLOY_STRATEGY: blue-green
# 原则(宪章5.1): 能确定性判定的不交给 LLM —— 本模板全是确定性门禁
# ============================================================

stages: [lint, test, build, scan, deploy]

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^task\//      # AI 开发分支
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------- lint ----------
lint:
  stage: lint
  image: python:3.12-slim      # 按项目技术栈在项目级覆盖 image
  rules:
    - if: $LINT_CMD
  script:
    - sh -c "$LINT_CMD"

# ---------- test ----------
unit-test:
  stage: test
  image: python:3.12-slim
  rules:
    - if: $ENABLE_UNIT_TEST == "true" && $TEST_CMD
  script:
    - sh -c "$TEST_CMD"
  coverage: '/TOTAL.+?(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: junit*.xml
    paths: [junit*.xml]
    expire_in: 1 week

# ---------- build ----------
build:
  stage: build
  image: python:3.12-slim
  rules:
    - if: $BUILD_CMD
  script:
    - sh -c "$BUILD_CMD"
  artifacts:
    paths: [dist/, build/]
    expire_in: 1 week

# ---------- scan (确定性安全门禁) ----------
gitleaks:
  stage: scan
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks git --redact --verbose --exit-code 1 .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

trivy:
  stage: scan
  image:
    name: aquasec/trivy:v0.74.0
    entrypoint: [""]
  variables:
    TRIVY_EXIT_CODE: "1"
    TRIVY_SEVERITY: "HIGH,CRITICAL"
  script:
    - trivy fs --exit-code $TRIVY_EXIT_CODE --severity $TRIVY_SEVERITY .
  rules:
    - if: $ENABLE_TRIVY == "true"

# ---------- docs 门户 ----------
pages:
  stage: build
  image: python:3.12-slim
  script:
    - pip install --quiet mkdocs-material==9.7.7
    - mkdocs build --site-dir public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- deploy (蓝绿, manual=门禁D后由 wf1 经 API 触发) ----------
deploy-production:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq
  script:
    - bash scripts/blue-green-deploy.sh   # 平台 pipelines/scripts/ 同步到项目或经 CI_TEMPLATE 引用
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG && $DEPLOY_STRATEGY == "blue-green"
      when: manual                       # 双保险: wf1 触发 + GitLab 页面手动可用
  allow_failure: false
